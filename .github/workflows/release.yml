name: release

# Publishing is tag-driven: create a tag vX.Y.Z (annotated) on the commit to ship.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build
        run: |
          set +e
          mvn -B -ntp -Dmaven.repo.local=$RUNNER_TEMP/m2 \
              -Dgeyser.version=${{ vars.GEYSER_VERSION || '2.11.2-SNAPSHOT' }} \
              verify 2>&1 | tee mvn.log
          ec=${PIPESTATUS[0]}
          if [ $ec -ne 0 ]; then
            grep -E "\[ERROR\]" mvn.log | head -50 | while IFS= read -r line; do
              printf '::error::%s\n' "$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')"
            done
          fi
          exit $ec
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          sha256sum target/skywindow-*.jar > target/skywindow-*.jar.sha256
          gh release create "$TAG" --verify-tag \
            --title "SkyWindow $TAG" \
            --notes "Geyser extension: windowed height support for Bedrock players (see README for guarantees and limits). SHA-256 in the checksum asset." \
            target/skywindow-*.jar "target/$(ls target | grep 'skywindow-.*\.jar\.sha256')"
