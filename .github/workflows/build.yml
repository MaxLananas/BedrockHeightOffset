name: build

on:
  push:
  pull_request:
  schedule:
    # Weekly drift probe: rebuilds against the newest Geyser snapshot of the pinned line.
    - cron: '20 6 * * 1'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GEYSER_VERSION: ${{ vars.GEYSER_VERSION || '2.11.2-SNAPSHOT' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Coordinate-math oracle (Python mirror of WindowRules and SectionCodec)
        run: python3 dev/verify/oracle.py 5
      - name: Build and test against Geyser ${{ env.GEYSER_VERSION }}
        run: |
          set +e
          mvn -B -ntp -Dmaven.repo.local="$RUNNER_TEMP/m2" \
              -Dgeyser.version="$GEYSER_VERSION" verify 2>&1 | tee mvn.log
          ec=${PIPESTATUS[0]}
          if [ "$ec" -ne 0 ]; then
            # Surface real errors as annotations: the raw log stream can be unavailable.
            grep -E "\[ERROR\]" mvn.log | head -50 | while IFS= read -r line; do
              printf '::error::%s\n' "$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')"
            done
          fi
          exit "$ec"
      - name: Test summary
        if: always()
        run: python3 dev/verify/surefire_summary.py target/surefire-reports >> "$GITHUB_STEP_SUMMARY"
      - name: Upload extension jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hypso-extension
          path: target/hypso-*.jar
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
